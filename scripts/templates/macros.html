{% macro icon(name, size=24, color='white') %}
    <div style="width: {{size}}px; height: {{size}}px; color: {{color}};"> <!-- erros are weird -->
        {% include 'icons/' ~ name ~ '_Icon.svg' %}
    </div> 
{% endmacro %}

{% macro menu_btn(url_name, icon_name, title, description) %}
    <a href="{{ url_for(url_name) }}" class="button button-menu">
        <div class="button-menu-main">
            <div class="icon">{{ icon(icon_name, size=60) }}</div>
            <div class="button-menu-info">
                <span class="emphasis txt-larger">{{title}}</span>
                <span>{{description}}</span>
            </div>
        </div>
        <span style="font-size:30px;">⟩</span>
    </a>
{% endmacro %}
