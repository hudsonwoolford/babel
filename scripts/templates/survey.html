    <!DOCTYPE html>
    <html>
    <head>
        <title>Bindr</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="phone">
            <h1>What is your taste in books?</h1> 
            <form action="/survey" method="post">
                {% for book in books %}
                <img src="{{ book.image.url }}" alt="Book cover" class="cover_image">
                <h3>{{ book.title }}</h2>
                <h4>{{ book.authors[0] }}</h4>
                <p>{{ ', '.join(book.genres.names[:3]) }}</p>
                
                    <div class="buttons">
                        <button class="btn-left" name="rating_{{ book.id }}" value="left">Pass</button>
                        <button class="btn-right" name="rating{{ book.id }}" value="right">Like</button>
                    </div>
                    {% endfor %}

                <button type="submit">Submit taste profile</button>
            </form>
        </div>
    </body>
    </html>
