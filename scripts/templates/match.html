{% extends 'base.html' %}

{% block content %}
<!-- Bold header area -->
<span class="swipe-header">
    <div class="logo-txt">Babel</div>
    <div class="emphasis txt-x-large" id="swipe-counter">(1/ {{ max_swipes }})</div>
</span>
<!-- Swiping area -->
<div class="swipe-area">
    <div class="swipe-direction">〈</div>
    <div class="swipe-stack" id="swipe-stack">

    </div>
    <div class="swipe-direction">⟩</div>
</div>

<!-- Book info area -->
<div class="book-info">
    <div id="book-rating" class="italics txt-large"></div>
    <div id="book-title" class="emphasis txt-x-large"></div>
    <div id="book-author"class="emphasis"></div>
    <div id="book-genres"></div>
    <div id="book-description" class="italics txt-small"></div>
    <br>
</div>

<script>
    const b_queue = {{book_queue | tojson}};
    const threshold = 100;
    const swipe_stack = document.getElementById("swipe-stack");
    const swipe_counter = document.getElementById("swipe-counter");
    const counter = {{counter}};
    const max_swipes = {{max_swipes}};
    swipe_counter.textContent = `(${counter}/${max_swipes})`;

    const NO_COVER_SVG = `data:image/svg+xml,${encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
    <rect width="200" height="300" fill="#e0e0e0"/>
    <text x="100" y="150" font-family="sans-serif" font-size="14" fill="#888"
            text-anchor="middle" dominant-baseline="middle">No Cover</text>
    </svg>`)}`;

    b_queue.forEach(b => add_card(b));
    initialise_elements(b_queue[0]);

    let x_start = 0;
    let is_dragging = false;
    let is_busy = false;
    let next_card = null;

    // swipe function that could be triggered by buttons or touch
    function trigger_swipe(direction) {
        if (swipe_stack.children.length == 0 || is_busy) { //no more cards left to swipe or busy
            return; //stop function
        } 

        is_busy = true;

        //get front/swiped card
        front_card = swipe_stack.lastElementChild;
        
        //collect data from front/swiped card
        const form_data = new FormData();
        form_data.append('book_id', JSON.parse(front_card.dataset.book).id);
        form_data.append('direction', direction);

        //animate card out
        front_card.style = '';
        front_card.classList.add(`animate-${direction}`);

        //init new front card if exists - otherwise should be initialised by add card with no children case
        if (swipe_stack.children.length >= 2) {
            const new_front = swipe_stack.children[swipe_stack.children.length-2];
            new_front.classList.add("front-card")
            initialise_elements(JSON.parse(new_front.dataset.book));
        }
        
        //delete card after transition complete
        front_card.addEventListener("transitionend", () => {
            front_card.remove();
            is_busy = false;
        }, {once:true})

        //fetch new book
        fetch("/swipe", {method: "POST", body: form_data}).then(res => res.json()).then(data => {
            if (data.done) { //session complete
                window.location.href = data.redirect;
                return;
            }
            if (!data.book) { // don't add a broken card
                console.error("No book returned from /swipe", data);
                return; 
            }
            //session incomplete -> new book
            console.log(data.book);

            swipe_counter.textContent = `(${data.counter}/${max_swipes})`
            add_card(data.book);
        });
    }

    // updates all book info elements
    function initialise_elements(book) {
        document.getElementById("book-title").textContent = book.title;
        document.getElementById("book-author").textContent = book.authors[0];

        let rating = Math.round(book.rating * 10) / 10
        let filled = Math.round(rating)
        document.getElementById("book-rating").textContent = `${rating.toFixed(1)} ${'★'.repeat(filled)}${'☆'.repeat(5 - filled)} (${book.ratings_count})`;
        document.getElementById("book-genres").textContent = book.genres.names.slice(0, 3).join(', ');
        if (book.description) {
            adj_desc = book.description
            if (book.description.length > 1000){
                adj_desc = `${book.description.slice(0, 1000)}...`;
            }
            document.getElementById("book-description").textContent = adj_desc;
        }
    }

    function add_card(book) {
        console.log(book)
        //create card element
        const card = document.createElement("div");
        card.classList.add("swipe-card");
        card.dataset.book = JSON.stringify(book);

        //content of the card, including swipe hints/overlays
        cover_url = book.image && book.image.url ? book.image.url : NO_COVER_SVG;
        card.innerHTML = `
        <img id="book-image" src="${ cover_url }" alt="Book cover" class="cover-image" draggable="false"> 
        <div class="swipe-hint left cover-image">X</div>
        <div class="swipe-hint right cover-image">♥</div>
        `;

        init_listeners(card); //touch swiping listeners

        //add card to list
        if (swipe_stack.children.length == 0) { //no children -> just add
            card.classList.add("front-card");
            swipe_stack.appendChild(card);
            initialise_elements(book);
        }
        else { //children -> add to back
            swipe_stack.insertBefore(card, swipe_stack.firstElementChild);
        }
    }

    function init_listeners(card) {
        card.addEventListener("pointerdown", (e) => {
            x_start = e.clientX;
            is_dragging = true;
            
            card.style.transition = 'none';
            e.preventDefault();
            card.setPointerCapture(e.pointerId);

            //set next card
            if (swipe_stack.children.length >= 2) {
                next_card = swipe_stack.children[swipe_stack.children.length-2]
            }
            else {
                next_card = null
            }
        })

        card.addEventListener("pointermove", (e) => {
            if (!is_dragging) return;

            let x_offset = e.clientX - x_start;
            const x_rot = x_offset * 0.08;

            progress = Math.min(Math.abs(x_offset), threshold)/threshold * 0.35;


            asymp_remap = Math.abs(x_offset) / (Math.abs(x_offset) + 8)
            if (next_card) next_card.style.transform = `scale(${0.8 + 0.2 * asymp_remap})`;
            card.querySelector(".swipe-hint.left").style.opacity = x_offset < 0 ? progress : 0;
            card.querySelector(".swipe-hint.right").style.opacity = x_offset > 0 ? progress : 0;

            card.style.transform = `translateX(${x_offset}px) rotate(${x_rot}deg)`;
        })

        card.addEventListener("pointerup", (e) => {
            is_dragging = false;
            let x_offset = e.clientX - x_start;

            //trigger swipe if needed
            if (x_offset < -threshold) {
                trigger_swipe("left");
            }
            else if (x_offset > threshold) {
                trigger_swipe("right");
            }
            else
            {
                card.style.transition = 'transform 0.3s ease';
                card.style.transform = 'translateX(0) rotate(0deg)';
                card.querySelectorAll(".swipe-hint").forEach(h => h.style.opacity = 0);
            }
        })

        card.addEventListener("pointercancel", () => {
            is_dragging = false;
            
            card.style.transition = 'transform 0.3s ease';
            card.style.transform = 'translateX(0) rotate(0deg)';
            card.querySelectorAll(".swipe-hint").forEach(h => h.style.opacity = 0);
        })
    }
</script>
{% endblock %}
