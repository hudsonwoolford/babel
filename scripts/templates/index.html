    <!DOCTYPE html>
    <html>
    <head>
        <title>Bindr</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="phone">
            <!-- <h1>Bindr</h1> -->
            <img src="{{ book.image.url }}" alt="Book cover" class="cover_image">
            <p>{{ book.rating | stars }} ({{ book.ratings_count }})</p>
            <h3>{{ book.title }}</h2>
            <h4>{{ book.authors[0] }}</h4>
            <p>{{ ', '.join(book.genres.names[:3]) }}</p>
            <p>{{ book.description | default("Unknown.") | truncate(125) }}</p>


            <form action="/swipe" method="post">
                <input type="hidden" name="book_id" value="{{ book.id }}">
                <div class="buttons">
                    <button class="btn-left" name="direction" value="left">Pass</button>
                    <button class="btn-right" name="direction" value="right">Like</button>
                </div>
            </form>
        </div>
    </body>
    </html>
