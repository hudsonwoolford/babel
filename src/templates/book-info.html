{% extends 'base.html' %}

{% block content %}

<!-- Swiping area -->
<div class="logo-txt">{{book.title}}</div>
<div class="swipe-area">
    <img src="{{ book.image.url }}" alt="Book cover" class="cover_image">
</div>

<!-- Book info area -->
<div class="book-info">
    <div id="book-rating" class="italics txt-large">{{ book.rating | stars }} ({{ book.ratings_count }})</div>
    <div id="book-author"class="emphasis">{{ book.authors[0] }}</div>
    <div id="book-genres">{{ ', '.join(book.genres.names[:3]) }}</div>
    <div id="book-description" class="italics txt-small">{{ book.description | default("Unknown.", True) | truncate(250) }}</div>
    <a href= "{{ 'https://hardcover.app/books/' + book.slug }}" target="_blank">See it on Hardcover</a>
</div>

{% endblock %}
